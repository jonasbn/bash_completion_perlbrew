matrix:
- name: Markdown
  aspell:
    lang: en
  dictionary:
    wordlists:
    - .wordlist.txt
    encoding: utf-8
  pipeline:
  - pyspelling.filters.markdown:
  - pyspelling.filters.html:
      comments: false
      ignores:
      - code
      - pre
  sources:
  # Match Markdown only, but exclude AI-generated files: CLAUDE.md and .claude/
  - '**/*.md|!CLAUDE.md|!.claude/**'
  default_encoding: utf-8
